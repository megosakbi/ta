<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MegoTools Hub</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Rubik+Puddles&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
background:#05060a;
font-family:'Poppins',sans-serif;
color:white;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
overflow:hidden;
}

/* particle canvas */

#particles{
position:fixed;
top:0;
left:0;
z-index:-1;
}

/* title */

h1{
font-family:'Rubik Puddles',cursive;
font-size:70px;
margin-bottom:60px;
background:linear-gradient(90deg,#00f0ff,#00ff9d,#6a5cff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
filter:drop-shadow(0 0 25px rgba(0,255,200,0.7));
}

/* buttons */

.container{
display:flex;
gap:30px;
flex-wrap:wrap;
justify-content:center;
}

.btn{
padding:18px 40px;
font-size:20px;
border-radius:12px;
border:none;
cursor:pointer;
color:white;
font-weight:600;
transition:0.35s;
}

.game{
background:linear-gradient(135deg,#ff2e63,#ff6b6b);
box-shadow:0 0 20px #ff2e63;
}

.clothes{
background:linear-gradient(135deg,#00c853,#69f0ae);
box-shadow:0 0 20px #00c853;
}

.bot{
background:linear-gradient(135deg,#2979ff,#00b0ff);
box-shadow:0 0 20px #2979ff;
}

.btn:hover{
transform:scale(1.1);
filter:brightness(1.2);
}

</style>
</head>

<body>

<canvas id="particles"></canvas>

<h1>MegoTools Hub</h1>

<div class="container">

<button class="btn game" onclick="location.href='GameCopier/'">
Game Copier
</button>

<button class="btn clothes" onclick="location.href='ClothesCopier/'">
Clothes Copier
</button>

<button class="btn bot" onclick="location.href='BotFollower/'">
Bot Follower
</button>

</div>

<script>

const canvas = document.getElementById("particles")
const ctx = canvas.getContext("2d")

canvas.width = window.innerWidth
canvas.height = window.innerHeight

let particles = []
let mouse = {x:null,y:null}

const particleCount = 120

for(let i=0;i<particleCount;i++){

particles.push({

x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
vx:(Math.random()-0.5)*0.5,
vy:(Math.random()-0.5)*0.5

})

}

document.addEventListener("mousemove",e=>{

mouse.x = e.x
mouse.y = e.y

})

function animate(){

ctx.clearRect(0,0,canvas.width,canvas.height)

for(let i=0;i<particles.length;i++){

let p = particles[i]

p.x += p.vx
p.y += p.vy

if(p.x<0||p.x>canvas.width) p.vx*=-1
if(p.y<0||p.y>canvas.height) p.vy*=-1

ctx.fillStyle="#00ffd5"
ctx.beginPath()
ctx.arc(p.x,p.y,2,0,Math.PI*2)
ctx.fill()

for(let j=i+1;j<particles.length;j++){

let p2 = particles[j]

let dx = p.x - p2.x
let dy = p.y - p2.y

let dist = Math.sqrt(dx*dx+dy*dy)

if(dist<120){

ctx.strokeStyle="rgba(0,255,200,0.15)"
ctx.beginPath()
ctx.moveTo(p.x,p.y)
ctx.lineTo(p2.x,p2.y)
ctx.stroke()

}

}

if(mouse.x){

let dx = p.x - mouse.x
let dy = p.y - mouse.y
let dist = Math.sqrt(dx*dx+dy*dy)

if(dist<150){

ctx.strokeStyle="rgba(0,255,255,0.4)"

ctx.beginPath()
ctx.moveTo(p.x,p.y)
ctx.lineTo(mouse.x,mouse.y)
ctx.stroke()

}

}

}

requestAnimationFrame(animate)

}

animate()

</script>

</body>
</html>
