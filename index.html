<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MegoTools Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
<style>
body{
  margin:0;
  height:100vh;
  font-family:'Orbitron', sans-serif;
  background:black;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  text-align:center;
  overflow:hidden;
}

/* MATRIX BACKGROUND */
canvas#matrix{
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  z-index:-1;
}

/* TITLE */
h1{
  font-size:64px;
  color:#00ff99;
  text-shadow:0 0 10px #00ff99,0 0 20px #00ff99,0 0 40px #00ff99,0 0 60px #00ff99;
  margin-bottom:50px;
  animation: glow 1.5s ease-in-out infinite alternate;
}

@keyframes glow{
  0% { text-shadow:0 0 10px #00ff99,0 0 20px #00ff99,0 0 40px #00ff99,0 0 60px #00ff99; color:#00ff99;}
  50% { text-shadow:0 0 20px #00ff99,0 0 40px #00ff99,0 0 60px #00ff99,0 0 80px #00ff99; color:#00ffaa;}
  100%{ text-shadow:0 0 10px #00ff99,0 0 20px #00ff99,0 0 40px #00ff99,0 0 60px #00ff99; color:#00ff99;}
}

/* BUTTONS */
button{
  margin:15px auto;
  padding:18px 40px;
  font-size:20px;
  border:none;
  border-radius:12px;
  text-transform:uppercase;
  letter-spacing:1px;
  font-family:'Orbitron', sans-serif;
  cursor:pointer;
  position:relative;
  z-index:1;
  color:white;
  box-shadow: 0 0 15px rgba(0,0,0,0.5), 0 0 30px rgba(0,0,0,0.3);
  transition: all 0.3s ease;
}

/* Neon colors */
#gameBtn{
  background:linear-gradient(45deg,#ff3c3c,#ff0000);
  box-shadow:0 0 10px #ff3c3c,0 0 20px #ff0000,0 0 30px #ff3c3c;
}
#clothesBtn{
  background:linear-gradient(45deg,#00ff88,#00c000);
  box-shadow:0 0 10px #00ff88,0 0 20px #00c000,0 0 30px #00ff88;
}
#botBtn{
  background:linear-gradient(45deg,#00c0ff,#0040ff);
  box-shadow:0 0 10px #00c0ff,0 0 20px #0040ff,0 0 30px #00c0ff;
}

button:hover{
  transform: scale(1.08);
  box-shadow:0 0 20px #fff,0 0 40px #fff,0 0 60px #fff;
}

</style>
</head>
<body>

<canvas id="matrix"></canvas>

<h1>MegoTools Hub</h1>

<button id="gameBtn" onclick="location.href='/gamecopier'">Game Copier</button>
<button id="clothesBtn" onclick="location.href='/clothescopier'">Clothes Copier</button>
<button id="botBtn" onclick="location.href='/botfollower'">Bot Follower</button>

<script>
// MATRIX EFFECT
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const letters = "アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズヅブプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨョロヲゴゾドボポ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const fontSize = 18;
const columns = canvas.width / fontSize;
const drops = [];

for(let x = 0; x < columns; x++){
  drops[x] = Math.random()*canvas.height;
}

function draw(){
  ctx.fillStyle = "rgba(0,0,0,0.05)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle = "#00ff00";
  ctx.font = fontSize + "px monospace";

  for(let i=0;i<drops.length;i++){
    const text = letters.charAt(Math.floor(Math.random()*letters.length));
    ctx.fillText(text,i*fontSize,drops[i]);
    drops[i] += fontSize;
    if(drops[i] > canvas.height && Math.random() > 0.975){
      drops[i] = 0;
    }
  }
}

setInterval(draw,50);

window.addEventListener('resize',()=>{
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});
</script>

</body>
</html>
