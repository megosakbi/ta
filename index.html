<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MegoTools Hub</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Rubik+Puddles&display=swap" rel="stylesheet">

<style>

body{
margin:0;
padding:0;
background:black;
color:white;
font-family:Arial;
overflow:hidden;
text-align:center;
}

canvas{
position:fixed;
top:0;
left:0;
z-index:-1;
}

h1{
font-family:'Rubik Puddles', cursive;
font-size:70px;
margin-top:120px;
color:#ffffff;
text-shadow:
0 0 10px #ff0000,
0 0 20px #ff0000,
0 0 40px #ff0000;
}

.container{
margin-top:80px;
}

.btn{
display:block;
width:300px;
margin:25px auto;
padding:18px;
font-size:22px;
border:none;
border-radius:12px;
cursor:pointer;
color:white;
font-weight:bold;
transition:0.3s;
box-shadow:0 0 20px rgba(0,0,0,0.5);
}

.btn:hover{
transform:scale(1.1);
box-shadow:0 0 30px white;
}

.game{
background:#ff0000;
}

.clothes{
background:#00cc44;
}

.bot{
background:#0077ff;
}

</style>
</head>

<body>

<canvas id="matrix"></canvas>

<h1>MegoTools Hub</h1>

<div class="container">

<button class="btn game" onclick="location.href='GameCopier/'">
Game Copier
</button>

<button class="btn clothes" onclick="location.href='ClothesCopier/'">
Clothes Copier
</button>

<button class="btn bot" onclick="location.href='BotFollower/'">
Bot Follower
</button>

</div>

<script>

const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

canvas.height = window.innerHeight;
canvas.width = window.innerWidth;

const letters = "アァカサタナハマヤャラワ0123456789";
const matrix = letters.split("");

const fontSize = 16;
const columns = canvas.width/fontSize;

const drops = [];

for(let x=0;x<columns;x++)
drops[x]=1;

function draw(){
ctx.fillStyle="rgba(0,0,0,0.05)";
ctx.fillRect(0,0,canvas.width,canvas.height);

ctx.fillStyle="#0f0";
ctx.font=fontSize+"px monospace";

for(let i=0;i<drops.length;i++){

const text = matrix[Math.floor(Math.random()*matrix.length)];

ctx.fillText(text,i*fontSize,drops[i]*fontSize);

if(drops[i]*fontSize>canvas.height && Math.random()>0.975)
drops[i]=0;

drops[i]++;

}

}

setInterval(draw,35);

</script>

</body>
</html>
