<!DOCTYPE html>
<html>
<head>
  <title>MegoTools</title>
</head>

<body>

<h1>MegoTools</h1>

<input id="userText" placeholder="Wpisz tekst">
<button onclick="sendToWebhook()">Start Process</button>

<script>
function sendToWebhook() {

  var text = document.getElementById("userText").value;

  fetch("TWOJ_WEBHOOK_URL", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      content: "Nowy tekst ze strony:\n" + text
    })
  });

  alert("Wysłano!");
}
</script>

</body>
</html>
