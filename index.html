<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MegoTools Hub</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Rubik+Puddles&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
background:#06070c;
font-family:'Poppins',sans-serif;
color:white;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
overflow:hidden;
}

/* animated gradient background */

.bg{
position:fixed;
width:200%;
height:200%;
background:linear-gradient(
120deg,
#0f2027,
#203a43,
#2c5364,
#1a1a40,
#000000
);
background-size:400% 400%;
animation:bgMove 15s ease infinite;
z-index:-3;
}

@keyframes bgMove{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

/* particles canvas */

canvas{
position:fixed;
top:0;
left:0;
z-index:-2;
}

/* title */

h1{
font-family:'Rubik Puddles',cursive;
font-size:70px;
margin-bottom:60px;
background:linear-gradient(90deg,#00f0ff,#00ff9d,#6a5cff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
filter:drop-shadow(0 0 20px rgba(0,255,200,0.6));
}

/* buttons */

.container{
display:flex;
gap:30px;
flex-wrap:wrap;
justify-content:center;
}

.btn{
padding:18px 40px;
font-size:20px;
border-radius:12px;
border:none;
cursor:pointer;
color:white;
font-weight:600;
transition:0.35s;
}

.game{
background:linear-gradient(135deg,#ff2e63,#ff6b6b);
box-shadow:0 0 20px #ff2e63;
}

.clothes{
background:linear-gradient(135deg,#00c853,#69f0ae);
box-shadow:0 0 20px #00c853;
}

.bot{
background:linear-gradient(135deg,#2979ff,#00b0ff);
box-shadow:0 0 20px #2979ff;
}

.btn:hover{
transform:scale(1.08);
filter:brightness(1.2);
}

</style>
</head>

<body>

<div class="bg"></div>

<canvas id="particles"></canvas>

<h1>MegoTools Hub</h1>

<div class="container">

<button class="btn game" onclick="location.href='GameCopier/'">
Game Copier
</button>

<button class="btn clothes" onclick="location.href='ClothesCopier/'">
Clothes Copier
</button>

<button class="btn bot" onclick="location.href='BotFollower/'">
Bot Follower
</button>

</div>

<script>

const canvas = document.getElementById("particles")
const ctx = canvas.getContext("2d")

canvas.width = window.innerWidth
canvas.height = window.innerHeight

let particles = []
let mouse = {x:null,y:null}

document.addEventListener("mousemove",e=>{
mouse.x=e.x
mouse.y=e.y

for(let i=0;i<3;i++){
particles.push({
x:mouse.x,
y:mouse.y,
size:Math.random()*4+1,
speedX:(Math.random()-0.5)*2,
speedY:(Math.random()-0.5)*2,
life:100
})
}

})

function animate(){

ctx.clearRect(0,0,canvas.width,canvas.height)

for(let i=0;i<particles.length;i++){

let p = particles[i]

ctx.fillStyle="rgba(0,255,200,0.8)"
ctx.beginPath()
ctx.arc(p.x,p.y,p.size,0,Math.PI*2)
ctx.fill()

p.x+=p.speedX
p.y+=p.speedY
p.life--

if(p.life<=0){
particles.splice(i,1)
i--
}

}

requestAnimationFrame(animate)

}

animate()

</script>

</body>
</html>
