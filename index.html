<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MegoTools Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
<style>
body{
  margin:0;
  min-height:100vh;
  font-family:'Orbitron', sans-serif;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  text-align:center;
  background:black;
  overflow:hidden;
}

/* Matrix tło */
canvas#matrix {
  position: fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  z-index:-1;
}

/* Tytuł */
h1{
  font-size:48px;
  margin-bottom:50px;
  background: linear-gradient(90deg, #ff3c3c, #00ff5c, #1e90ff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: titleGlow 2s ease-in-out infinite alternate;
}

@keyframes titleGlow{
  from {text-shadow: 0 0 10px #ff3c3c, 0 0 20px #00ff5c, 0 0 30px #1e90ff;}
  to {text-shadow: 0 0 20px #ff3c3c, 0 0 40px #00ff5c, 0 0 60px #1e90ff;}
}

/* Przyciski */
button{
  margin:15px auto;
  padding:18px 40px;
  font-size:20px;
  font-family:'Orbitron', sans-serif;
  border:none;
  border-radius:15px;
  cursor:pointer;
  transition: all 0.3s ease;
  box-shadow: 0 6px 15px rgba(0,0,0,0.4);
  color:white;
  text-transform:uppercase;
  letter-spacing:1px;
}
button:hover{
  transform: translateY(-5px) scale(1.05);
  box-shadow: 0 12px 25px rgba(0,0,0,0.6);
}
#gameBtn{background: linear-gradient(45deg,#ff4c4c,#ff0000);}
#clothesBtn{background: linear-gradient(45deg,#00ff88,#00c000);}
#botBtn{background: linear-gradient(45deg,#00c0ff,#0040ff);}
</style>
</head>
<body>

<canvas id="matrix"></canvas>

<h1>MegoTools Hub</h1>

<button id="gameBtn" onclick="location.href='/gamecopier'">Game Copier</button>
<button id="clothesBtn" onclick="location.href='/clothescopier'">Clothes Copier</button>
<button id="botBtn" onclick="location.href='/botfollower'">Bot Follower</button>

<script>
// MATRIX EFFECT
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const letters = "アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズヅブプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨョロヲゴゾドボポ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const fontSize = 18;
const columns = canvas.width / fontSize;
const drops = [];

for(let x = 0; x < columns; x++){
  drops[x] = Math.random() * canvas.height;
}

function draw(){
  ctx.fillStyle = "rgba(0,0,0,0.05)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle = "#00ff00";
  ctx.font = fontSize + "px monospace";

  for(let i = 0; i < drops.length; i++){
    const text = letters.charAt(Math.floor(Math.random() * letters.length));
    ctx.fillText(text, i*fontSize, drops[i]);
    drops[i] += fontSize;
    if(drops[i] > canvas.height && Math.random() > 0.975){
      drops[i] = 0;
    }
  }
}

setInterval(draw, 50);

window.addEventListener('resize', () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});
</script>

</body>
</html>
