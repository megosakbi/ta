<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MegoTools Hub</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Rubik+Puddles&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
background:#0b0b0f;
font-family:'Poppins',sans-serif;
color:white;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
overflow:hidden;
}

/* animated background */

body::before{
content:"";
position:fixed;
width:200%;
height:200%;
background:linear-gradient(
45deg,
#0b0b0f,
#111122,
#0b0b0f,
#1a0033
);
animation:bgMove 12s linear infinite;
z-index:-2;
}

@keyframes bgMove{
0%{transform:translate(0,0)}
50%{transform:translate(-25%,-25%)}
100%{transform:translate(0,0)}
}

/* mouse glow effect */

.cursor-glow{
position:fixed;
width:300px;
height:300px;
background:radial-gradient(circle,rgba(0,255,200,0.25),transparent 60%);
pointer-events:none;
transform:translate(-50%,-50%);
z-index:-1;
}

/* title */

h1{
font-family:'Rubik Puddles',cursive;
font-size:70px;
margin-bottom:60px;
background:linear-gradient(90deg,#00f0ff,#00ff9d,#6a5cff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
animation:titleGlow 3s infinite alternate;
}

@keyframes titleGlow{
from{filter:drop-shadow(0 0 5px #00f0ff)}
to{filter:drop-shadow(0 0 25px #00ffcc)}
}

/* buttons */

.container{
display:flex;
gap:30px;
flex-wrap:wrap;
justify-content:center;
}

.btn{
padding:18px 35px;
font-size:20px;
border-radius:12px;
border:none;
cursor:pointer;
color:white;
font-weight:600;
transition:0.35s;
}

.game{
background:linear-gradient(135deg,#ff2e63,#ff6b6b);
}

.clothes{
background:linear-gradient(135deg,#00c853,#69f0ae);
}

.bot{
background:linear-gradient(135deg,#2979ff,#00b0ff);
}

.btn:hover{
transform:translateY(-6px) scale(1.05);
box-shadow:0 10px 35px rgba(0,0,0,0.6);
}

</style>
</head>

<body>

<div class="cursor-glow" id="glow"></div>

<h1>MegoTools Hub</h1>

<div class="container">

<button class="btn game" onclick="location.href='GameCopier/'">
Game Copier
</button>

<button class="btn clothes" onclick="location.href='ClothesCopier/'">
Clothes Copier
</button>

<button class="btn bot" onclick="location.href='BotFollower/'">
Bot Follower
</button>

</div>

<script>

const glow = document.getElementById("glow")

document.addEventListener("mousemove",(e)=>{

glow.style.left = e.clientX + "px"
glow.style.top = e.clientY + "px"

})

</script>

</body>
</html>
