<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MegoTools Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
<style>
/* Body i tło */
body{
  margin:0;
  min-height:100vh;
  font-family:'Orbitron', sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  background: linear-gradient(-45deg, #1a0000, #002200, #00002a, #1a0000);
  background-size: 400% 400%;
  animation: gradientShift 15s ease infinite;
  flex-direction:column;
  text-align:center;
  color:white;
}

@keyframes gradientShift{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

/* Tytuł */
h1{
  font-size:48px;
  margin-bottom:50px;
  background: linear-gradient(90deg, #ff3c3c, #00ff5c, #1e90ff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: titleGlow 2s ease-in-out infinite alternate;
}

@keyframes titleGlow{
  from {text-shadow: 0 0 10px #ff3c3c, 0 0 20px #00ff5c, 0 0 30px #1e90ff;}
  to {text-shadow: 0 0 20px #ff3c3c, 0 0 40px #00ff5c, 0 0 60px #1e90ff;}
}

/* Przyciski */
button{
  margin:15px auto;
  padding:18px 40px;
  font-size:20px;
  font-family:'Orbitron', sans-serif;
  border:none;
  border-radius:15px;
  cursor:pointer;
  transition: all 0.3s ease;
  box-shadow: 0 6px 15px rgba(0,0,0,0.4);
  color:white;
  text-transform:uppercase;
  letter-spacing:1px;
}

/* Hover efekt 3D */
button:hover{
  transform: translateY(-5px) scale(1.05);
  box-shadow: 0 12px 25px rgba(0,0,0,0.6);
}

/* Kolory przycisków */
#gameBtn{
  background: linear-gradient(45deg,#ff4c4c,#ff0000);
}
#clothesBtn{
  background: linear-gradient(45deg,#00ff88,#00c000);
}
#botBtn{
  background: linear-gradient(45deg,#00c0ff,#0040ff);
}
</style>
</head>
<body>

<h1>MegoTools Hub</h1>

<button id="gameBtn" onclick="location.href='/gamecopier'">Game Copier</button>
<button id="clothesBtn" onclick="location.href='/clothescopier'">Clothes Copier</button>
<button id="botBtn" onclick="location.href='/botfollower'">Bot Follower</button>

</body>
</html>
