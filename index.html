<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Text Extractor</title>
</head>
<body>

<h2>Paste your text below</h2>

<textarea id="inputBox" style="width: 90%; height: 200px;"></textarea>
<br><br>

<input type="text" id="extractStart" placeholder="Start marker">
<input type="text" id="extractEnd" placeholder="End marker">
<button onclick="extractAndSend()">Extract & Send</button>

<script>
async function extractAndSend() {
    const fullText = document.getElementById('inputBox').value;
    const start = document.getElementById('extractStart').value;
    const end = document.getElementById('extractEnd').value;

    if (!start || !end) {
        alert("Enter start and end markers first.");
        return;
    }

    const startIndex = fullText.indexOf(start);
    const endIndex = fullText.indexOf(end);

    if (startIndex === -1 || endIndex === -1 || endIndex <= startIndex) {
        alert("Markers not found.");
        return;
    }

    const extracted = fullText.substring(startIndex + start.length, endIndex).trim();

    const webhookURL = "YOUR_DISCORD_WEBHOOK_URL";

    await fetch(webhookURL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ content: extracted })
    });

    alert("Sent to webhook!");
}
</script>

</body>
</html>
