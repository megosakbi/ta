<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MegoTools Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<style>
body{
  margin:0;
  min-height:100vh;
  font-family:'Orbitron', sans-serif;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(-45deg,#0a0000,#200000,#3a0000,#0a0000);
  background-size:400% 400%;
  animation:bgmove 12s infinite;
  flex-direction:column;
  text-align:center;
}
@keyframes bgmove{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}
h1{
  font-size:40px;
  margin-bottom:50px;
  color:#ff3c3c;
  text-shadow: 0 0 10px red, 0 0 20px red, 0 0 40px red;
}
button{
  display:block;
  margin:15px auto;
  padding:15px 30px;
  font-size:20px;
  font-family:'Orbitron', sans-serif;
  border:none;
  border-radius:12px;
  cursor:pointer;
  transition:0.3s;
  box-shadow:0 0 15px rgba(0,0,0,0.5);
}
button:hover{
  transform:scale(1.05);
  box-shadow:0 0 20px rgba(0,0,0,0.7);
}

/* kolory przycisków */
#gameBtn{
  background:#ff0000;
  color:white;
  box-shadow:0 0 15px red;
}
#gameBtn:hover{
  background:darkred;
  box-shadow:0 0 20px red,0 0 40px red;
}

#clothesBtn{
  background:#00c000;
  color:white;
  box-shadow:0 0 15px green;
}
#clothesBtn:hover{
  background:darkgreen;
  box-shadow:0 0 20px green,0 0 40px green;
}

#botBtn{
  background:#0090ff;
  color:white;
  box-shadow:0 0 15px blue;
}
#botBtn:hover{
  background:darkblue;
  box-shadow:0 0 20px blue,0 0 40px blue;
}
</style>
</head>
<body>

<h1>MegoTools Hub</h1>

<button id="gameBtn" onclick="location.href='/gamecopier'">Game Copier</button>
<button id="clothesBtn" onclick="location.href='/clothescopier'">Clothes Copier</button>
<button id="botBtn" onclick="location.href='/botfollower'">Bot Follower</button>

</body>
</html>
